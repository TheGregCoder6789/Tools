<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.min.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex; justify-content: center; align-items: center;
      background-color: #f0f0f0; font-family: Arial, sans-serif;
      transition: background-color 0.3s ease;
    }
    .calculator {
      border: 1px solid #000000; padding: 10px; width: 380px;
      background-color: #ffffff; border-radius: 10px;
      box-shadow: 0 0 10px #0000001a;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #display {
      width: 100%; margin: 10px 0; padding: 10px;
      box-sizing: border-box; font-size: 1.5em; font-family: monospace;
      border: 1px solid #ccc; border-radius: 5px;
    }
    .buttons {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 15px 10px;
    }
    button {
      height: 60px; font-size: 1.1em; border: none; border-radius: 5px;
      cursor: pointer; padding: 0; font-family: monospace;
      transition: background-color 0.3s ease;
    }
    .gray { background-color: #505050; color: #FFFFFF; }
    .white { background-color: #D4D4D2; color: #000000; }
    .orange { background-color: #FF9500; color: #FFFFFF; }
    .gray0 {
      background-color: #505050; color: #FFFFFF;
      grid-column: span 2; text-align: left; padding-left: 20px;
    }
    .scientific-buttons {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 10px;
    }
    .sci {
      width: 70px; height: 30px; font-size: 0.9em;
      background-color: #505050; color: #fff;
      border: none; border-radius: 5px; cursor: pointer;
    }
    .theme-toggle {
      margin-top: 10px; width: 100%; padding: 10px;
      font-size: 1em; border-radius: 5px; border: none;
      background-color: #ddd; cursor: pointer;
    }
    body.dark { background-color: #1e1e1e; }
    body.dark .calculator { background-color: #2c2c2c; color: #ffffff; }
    body.dark .gray, body.dark .gray0 { background-color: #333; }
    body.dark .sci { background-color: #444; }
    @media (max-width: 400px) { .calculator { width: 90%; } }

    #copyMsg {
      position: fixed;
      bottom: -50px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: all 0.8s ease;
    }
    #copyMsg.show {
      bottom: 20px;
      opacity: 1;
    }

    #history {
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.9em;
      max-height: 120px;
      overflow-y: auto;
      border-top: 1px solid #ccc;
      padding-top: 5px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="scientific-buttons">
      <button onclick="append('sin(')" class="sci">sin</button>
      <button onclick="append('cos(')" class="sci">cos</button>
      <button onclick="append('tan(')" class="sci">tan</button>
      <button onclick="append('sqrt(')" class="sci">√</button>
      <button onclick="append('log(')" class="sci">log</button>
      <button onclick="append('pi')" class="sci">π</button>
      <button onclick="append('e')" class="sci">e</button>
      <button onclick="append('^')" class="sci">^</button>
      <button onclick="append(')')" class="sci">)</button>
      <button onclick="toggleDegrees()" class="sci">deg/rad</button>
    </div>

    <input type="text" id="display" readonly placeholder="0" />

    <div class="buttons">
      <button onclick="clear_()" class="white">C</button>
      <button onclick="del_()" class="gray" aria-label="Backspace"><i class="material-icons">backspace</i></button>
      <button onclick="perc()" class="gray">%</button>
      <button onclick="append('/')" class="orange">/</button>

      <button onclick="append('7')" class="gray">7</button>
      <button onclick="append('8')" class="gray">8</button>
      <button onclick="append('9')" class="gray">9</button>
      <button onclick="append('*')" class="orange">*</button>

      <button onclick="append('4')" class="gray">4</button>
      <button onclick="append('5')" class="gray">5</button>
      <button onclick="append('6')" class="gray">6</button>
      <button onclick="append('-')" class="orange">-</button>

      <button onclick="append('1')" class="gray">1</button>
      <button onclick="append('2')" class="gray">2</button>
      <button onclick="append('3')" class="gray">3</button>
      <button onclick="append('+')" class="orange">+</button>

      <button onclick="append('0')" class="gray0">0</button>
      <button onclick="append('.')" class="gray">.</button>
      <button onclick="calc_()" class="orange">=</button>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button>
    <div id="history"></div>
  </div>

  <div id="copyMsg"></div>

  <script>
    const displayjs = document.getElementById('display');
    const historyDiv = document.getElementById('history');
    let oper = "";
    let useDegrees = false;

    function append(val) {
      if (['+','-','*','/'].includes(val)) oper = val;
      if (displayjs.value === 'Error') displayjs.value = '';
      displayjs.value += val;
    }

    function clear_() {
      displayjs.value = '';
    }

    function del_() {
      displayjs.value = displayjs.value.slice(0, -1);
    }

    function perc() {
      const match = displayjs.value.match(/(\d+)(?!.*\d)/);
      if (match) {
        const percent = parseFloat(match[0]) / 100;
        displayjs.value = displayjs.value.replace(/(\d+)(?!.*\d)/, percent);
      }
    }

    function calc_() {
      try {
        let expr = displayjs.value;

        if (useDegrees) {
          expr = expr.replace(/sin\(([^)]+)\)/g, (_, angle) => `sin(${angle} deg)`);
          expr = expr.replace(/cos\(([^)]+)\)/g, (_, angle) => `cos(${angle} deg)`);
          expr = expr.replace(/tan\(([^)]+)\)/g, (_, angle) => `tan(${angle} deg)`);
        }

        const result = math.evaluate(expr);

        historyDiv.innerHTML += `${expr} = ${result}<br>`;
        displayjs.value = result;

        localStorage.setItem("CalculatorStats", JSON.stringify({
          CalcVal: displayjs.value,
          Oper: oper,
          IsValid: true
        }));
      } catch (error) {
        displayjs.value = 'Error';
        localStorage.setItem("CalculatorStats", JSON.stringify({
          CalcVal: displayjs.value,
          Oper: oper,
          IsValid: false
        }));
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      toast(document.body.classList.contains('dark') ? 'Dark mode on' : 'Dark mode off');
    }

    function toggleDegrees() {
      useDegrees = !useDegrees;
      toast(`Mode: ${useDegrees ? 'Degrees' : 'Radians'}`);
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (!isNaN(key) || ['+','-','*','/','.','^','(',')'].includes(key)) {
        append(key);
      } else if (key === 'Enter') {
        e.preventDefault();
        calc_();
      } else if (key === 'Backspace') {
        e.preventDefault();
        del_();
      } else if (key.toLowerCase() === 'c') {
        clear_();
      }
    });

    function toast(message) {
      const msg = document.getElementById('copyMsg');
      msg.textContent = message;
      msg.classList.add('show');
      setTimeout(() => {
        msg.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
